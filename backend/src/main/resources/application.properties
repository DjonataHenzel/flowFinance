spring.application.name=FlowFinance
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistemaFinanceiro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:djonata}
spring.datasource.driver-class-name=org.postgresql.Driver
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.public-url=${APP_PUBLIC_URL:http://flowfinance.ddns.net}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${APP_TIME_ZONE:America/Sao_Paulo}'
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
ntfy.base-url=${NTFY_BASE_URL:https://ntfy.sh}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
